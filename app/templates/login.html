{% extends "base.html" %}
{% block title %}Log in · SnP Checker{% endblock %}
{% block wrap_class %}hero-auth{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="overline">Welcome back</div>
  <h1>Log in</h1>
  <p class="auth-sub">Sign in to review scripts against S&amp;P guidelines.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>Email
      <input type="email" name="email" required autofocus autocomplete="email" placeholder="you@hoichoi.tv" />
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
    </label>
    <button type="submit" class="primary wide">Log in</button>
  </form>
  <div class="foot">No account? <a href="/signup">Sign up</a></div>
</div>
{% endblock %}
